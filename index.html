<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Project Showcase</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f5f6f8;
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            margin-bottom: 10px;
            font-size: 32px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card img {
            width: 100%;
            display: block;
            border-radius: 8px;
        }

        .title {
            padding: 12px 4px 4px;
            font-size: 15px;
            color: #444;
        }

        /* 图片放大 */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .modal img {
            max-width: 95%;
            max-height: 90%;
            object-fit: contain;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        /* 手机端 */
        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>AI Project Showcase</h1>
        <p>LLM · Agent · Workflow · RAG</p>
    </div>

    <div class="gallery">

        <div class="card" onclick="openImage('1.png')">
            <img src="1.png">
            <div class="title">项目截图 01</div>
        </div>

        <div class="card" onclick="openImage('2.png')">
            <img src="2.png">
            <div class="title">项目截图 02</div>
        </div>

        <div class="card" onclick="openImage('3.png')">
            <img src="3.png">
            <div class="title">项目截图 03</div>
        </div>

        <div class="card" onclick="openImage('4.png')">
            <img src="4.png">
            <div class="title">项目截图 04</div>
        </div>

    </div>

</div>

<!-- 图片放大窗口 -->
<div class="modal" id="modal" onclick="closeImage()">
    <span class="close">&times;</span>
    <img id="modalImage">
</div>

<script>

function openImage(image) {
    document.getElementById("modalImage").src = image;
    document.getElementById("modal").style.display = "flex";
}

function closeImage() {
    document.getElementById("modal").style.display = "none";
}

</script>

</body>
</html>
